[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "writing-eval"
version = "0.1.0"
description = "Deterministic writing evaluation metrics and reports"
license = "Elastic-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0",
]

[project.scripts]
writing-eval = "writing_eval.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/writing_eval"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
